# BitWarden — Enterprise credential management pack.
#
# Domain: credential rotation, secret provisioning, access audit, vault sync.
# Restricted infrastructure — highest security sensitivity in the enterprise.

[pack]
name = "bitwarden"
schema = 2

[imports.moocity]
source = "../moocity"

[[named_session]]
template = "polecat"
scope = "rig"
mode = "on_demand"

