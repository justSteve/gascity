# Strader — SPX options trading intelligence pack.
#
# Domain: 0DTE options analysis, LuxAlgo indicator suite, pattern detection.
# Hard boundary: never places/modifies/cancels orders without human confirmation.

[pack]
name = "strader"
schema = 2

[imports.moocity]
source = "../moocity"

[[named_session]]
template = "polecat"
scope = "rig"
mode = "on_demand"

