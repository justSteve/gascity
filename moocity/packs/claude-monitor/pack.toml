# claude-monitor — Enterprise institutional memory service pack.
#
# Domain: memory ingestion, cross-zgent recall, activity summarization,
# knowledge graph maintenance. The enterprise's memory and recall layer.

[pack]
name = "claude-monitor"
schema = 2

[imports.moocity]
source = "../moocity"

[[named_session]]
template = "polecat"
scope = "rig"
mode = "on_demand"

