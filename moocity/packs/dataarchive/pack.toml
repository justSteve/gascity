# DataArchive — Persistent storage and retrieval service pack.
#
# Domain: drive scanning, dedup, indexing, artifact storage on Z:.
# Consolidates decades of digital history into a coherent archive.

[pack]
name = "dataarchive"
schema = 2

[imports.moocity]
source = "../moocity"

[[named_session]]
template = "polecat"
scope = "rig"
mode = "on_demand"

