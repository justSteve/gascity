# PaneWarden — Presentation-layer steward pack.
#
# Domain: tmux session management, layout orchestration, status lines,
# cross-session attendance. Broad tmux WRITE across enterprise.

[pack]
name = "panewarden"
schema = 2

[imports.moocity]
source = "../moocity"

[[named_session]]
template = "polecat"
scope = "rig"
mode = "on_demand"

