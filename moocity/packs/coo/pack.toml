# COO — Enterprise operations and conventions pack.
#
# Domain: factory pipeline, convention deployment, zgent certification,
# cross-enterprise tooling. COO builds what every other zgent depends on.

[pack]
name = "coo"
schema = 2

[imports.moocity]
source = "../moocity"

[[named_session]]
template = "polecat"
scope = "rig"
mode = "on_demand"

