# DReader — Discord intelligence collector pack.
#
# Domain: browser-based Discord scraping, channel indexing, query API.
# Constraint: no Discord API access — all retrieval via DOM scraping.

[pack]
name = "dreader"
schema = 2

[imports.moocity]
source = "../moocity"

[[named_session]]
template = "polecat"
scope = "rig"
mode = "on_demand"

